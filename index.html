<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Chimney Expert Ghaziabad</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#0B1220;overflow-x:hidden}
.hero{position:relative;min-height:88vh;display:grid;place-items:center;padding:30px 20px;overflow:hidden}
.bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=1200') center/cover no-repeat;filter:blur(18px) brightness(.5);transform:scale(1.2)}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,32,.3),rgba(11,18,32,.9))}
.content{position:relative;z-index:2;max-width:900px;text-align:center;color:white}
.badge{background:#22c55e;color:white;padding:8px 16px;border-radius:100px;font-size:12px;font-weight:800;letter-spacing:1px;display:inline-block;box-shadow:0 0 20px #22c55e88}
.title-wrap{margin-top:24px;perspective:800px;min-height:150px;display:grid;place-items:center}
.h1{font-size:56px;font-weight:800;line-height:.9;letter-spacing:-2px;text-transform:uppercase}
@media(max-width:700px){.h1{font-size:38px}}
.word{display:inline-block;opacity:0;transform:translateY(-120px) rotateX(-90deg);animation:fall .8s cubic-bezier(.2,1.5,.5,1) forwards}
@keyframes fall{
0%{opacity:0;transform:translateY(-200px) rotateX(-90deg) scale(.5);filter:blur(10px)}
60%{opacity:1;transform:translateY(20px) rotateX(20deg) scale(1.1);filter:blur(0)}
80%{transform:translateY(-10px) rotateX(-10deg)}
100%{opacity:1;transform:translateY(0) rotateX(0) scale(1)}
}
.sub{margin-top:18px;color:#cbd5e1;font-size:18px;max-width:600px;margin-left:auto;margin-right:auto;line-height:1.5;opacity:0;animation:fadeIn 1s .9s forwards}
@keyframes fadeIn{to{opacity:1}}
.cta{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;opacity:0;animation:fadeIn 1s 1.2s forwards}
.btn1{background:white;color:#0B1220;padding:18px 32px;border-radius:100px;font-weight:800;text-decoration:none;box-shadow:0 12px 30px rgba(255,255,255,.2)}
.btn2{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:white;padding:18px 32px;border-radius:100px;font-weight:800;text-decoration:none}
.card{background:white;border-radius:28px;padding:22px;max-width:1000px;margin:-60px auto 20px;position:relative;z-index:3;box-shadow:0 20px 60px rgba(0,0,0,.3);margin-left:16px;margin-right:16px}
@media(min-width:1000px){.card{margin-left:auto;margin-right:auto}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.box{background:#f8fafc;border-radius:18px;padding:18px;border:1px solid #f1f5f9}
.dots{position:absolute;inset:0;pointer-events:none}
.dot2{position:absolute;width:4px;height:4px;background:white;border-radius:50%;opacity:.6;animation:float 6s infinite linear}
@keyframes float{0%{transform:translateY(0)}100%{transform:translateY(-100vh)}}
</style>
</head>
<body>
<div class="hero">
<div class="bg" id="bg"></div>
<div class="overlay"></div>
<div class="dots" id="dots"></div>
<div class="content">
<div class="badge">● LIVE • SAME DAY • GHAZIABAD</div>
<div class="title-wrap"><h1 class="h1" id="h1"></h1></div>
<p class="sub" id="sub">10+ Years Expert • 90 Days Warranty • Vaishali, Indirapuram, Vasundhara</p>
<div class="cta">
<a class="btn1" href="tel:8796284796">📞 8796284796 - Call Now</a>
<a class="btn2" href="https://wa.me/918796284796">WhatsApp</a>
</div>
</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
<div style="display:flex;gap:8px"><span style="background:#e0f2fe;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800">⚡ Same Day</span><span style="background:#dcfce7;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800">🛡️ 90 Days Warranty</span><span style="background:#fef9c3;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800">⭐ 4.9 Rating</span></div>
<div style="font-weight:800">8796284796</div>
</div>
<div class="grid" style="margin-top:20px" id="grid"></div>
<div id="details" style="margin-top:24px;color:#475569;line-height:1.7"></div>
</div>

<script>
// Falling words animation
const b=(new URLSearchParams(location.search).get('brand')||'faber').toLowerCase();
const B=b.charAt(0).toUpperCase()+b.slice(1);

const titles={
faber:["Faber","Chimney","Service","Ghaziabad"],
hafele:["Hafele","Premium","Service","Ghaziabad"],
elica:["Elica","12 Services","Expert","Ghaziabad"],
aria:["Aria Anthem","Builder","Expert","Ghaziabad"]
};
const arr=titles[b]||titles.faber;
const h1=document.getElementById('h1');
h1.innerHTML='';
arr.forEach((w,i)=>{
  const span=document.createElement('span');
  span.className='word';
  span.style.animationDelay=`${i*0.18}s`;
  span.innerHTML=w+'&nbsp;';
  if(i===0) span.style.color='#22c55e';
  h1.appendChild(span);
});

// Slideshow - har 4 sec pe title change hawa se girke
let idx=0;
const allBrands=Object.keys(titles);
setInterval(()=>{
  idx=(idx+1)%allBrands.length;
  const key=allBrands[idx];
  const words=titles[key];
  h1.innerHTML='';
  words.forEach((w,i)=>{
    const s=document.createElement('span');
    s.className='word';
    s.style.animationDelay=`${i*0.18}s`;
    s.innerHTML=w+'&nbsp;';
    if(i===0) s.style.color='#22c55e';
    h1.appendChild(s);
  });
},4000);

// Blur chimney images slideshow background
const imgs=[
'https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=1200',
'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1200',
'https://images.unsplash.com/photo-1484154218962-a197022b5858?w=1200'
];
let bgI=0;
setInterval(()=>{
  bgI=(bgI+1)%imgs.length;
  document.getElementById('bg').style.backgroundImage=`url('${imgs[bgI]}')`;
},3500);

// Floating dots
const dots=document.getElementById('dots');
for(let i=0;i<20;i++){
  const d=document.createElement('div');
  d.className='dot2';
  d.style.left=Math.random()*100+'%';
  d.style.top=Math.random()*100+'%';
  d.style.animationDelay=Math.random()*5+'s';
  d.style.animationDuration=(4+Math.random()*4)+'s';
  dots.appendChild(d);
}

// Content
const data={
faber:{d:"Faber deep cleaning, motor repair, suction 2x boost, charcoal filter, baffle filter, auto-clean fix.",g:["Deep Clean","Motor Repair","Filter Change"]},
hafele:{d:"Hafele PCB, touch panel, oil collector specialist - premium care.",g:["PCB Expert","Touch Fix","Oil Collector"]},
elica:{d:"Elica 12 Services: Cleaning, Motor, Filter, PCB, Suction, Noise, Oil Leakage, Installation, Duct, Touch, Wiring, General.",g:["12 Services","Noise Fix","Installation"]},
aria:{d:"Aria Anthem builder chimney grease & suction expert.",g:["Builder Expert","Quick Fix","Same Day"]}
};
const c=data[b]||data.faber;
document.getElementById('details').innerHTML=`<h2 style="color:#0B1220;font-size:20px;margin-bottom:8px">${B} Details</h2><p>${c.d}</p><p style="margin-top:10px;font-size:13px;color:#64748b">Service Areas: Vaishali, Indirapuram, Vasundhara, Raj Nagar, Kaushambi, Crossing Republik - Call 8796284796</p>`;
document.getElementById('grid').innerHTML=c.g.map(x=>`<div class="box"><b>✓ ${x}</b><div style="font-size:12px;color:#64748b;margin-top:4px">Expert Service</div></div>`).join('');
</script>
</body>
</html>
